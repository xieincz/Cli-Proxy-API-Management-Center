name: Build and Release Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch: # 新增：允许在 GitHub Actions 页面手动点击触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev # 新增：强制拉取 dev 分支的代码（防止手动触发时选错分支）
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: dev-${{ github.sha }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          : > release-notes.md
          echo "Automated development build." >> release-notes.md
          echo "" >> release-notes.md
          git log -1 --pretty=format:"- %h %s" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-${{ github.sha }}
          name: Dev Build (${{ github.sha }})
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true  # 强制标记为 Latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}